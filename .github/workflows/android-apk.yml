name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners already carry the Android SDK; the action that used to
      # download it is unnecessary here and its Node runtime broke the job, so it is gone.
      - name: Point Gradle at the preinstalled SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" || true
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          fi
          ls "$SDK/platforms" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Compile before testing, keeping the output: a Kotlin error is a compiler message, and
      # `diagnostics.txt` below is what a person (or an agent without log access) reads.
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace 2>&1 | tee build-compile.log

      - name: Diagnostics
        if: always()
        run: |
          mkdir -p out
          {
            echo "== exit summary =="
            grep -E "^(e:|w: .*(deprecat|unused))|error:|FAILURE:|What went wrong|Caused by:"               build-compile.log | head -120 || true
            echo
            echo "== last 80 lines =="
            tail -80 build-compile.log || true
          } > out/diagnostics.txt
          wc -l out/diagnostics.txt

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          find app/build/outputs -name "*.apk" -exec cp {} out/ \;
          ls -lh out || true
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          ls -lh out/*.apk >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no apk produced" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangascribe-debug-apk
          path: out/*.apk
          if-no-files-found: warn

      # No log access from every environment, but the repository is readable from all of
      # them: a failed build commits what the compiler said to ci-diagnostics.txt.
      - name: Publish diagnostics to the branch
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "mangascribe-ci"
          git config user.email "ci@users.noreply.github.com"
          cp out/diagnostics.txt ci-diagnostics.txt
          git add ci-diagnostics.txt
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "ci: compiler diagnostics [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: out/diagnostics.txt
          if-no-files-found: ignore

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results*.html
          if-no-files-found: ignore
