name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners already carry the Android SDK; the action that used to
      # download it is unnecessary here and its Node runtime broke the job, so it is gone.
      - name: Point Gradle at the preinstalled SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" || true
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          fi
          ls "$SDK/platforms" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Compile before testing, keeping the output: a Kotlin error is a compiler message, and
      # `diagnostics.txt` below is what a person (or an agent without log access) reads.
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace 2>&1 | tee build-compile.log

      - name: Diagnostics
        if: always()
        run: |
          mkdir -p out
          {
            echo "== exit summary =="
            grep -E "^(e:|w: .*(deprecat|unused))|error:|FAILURE:|What went wrong|Caused by:"               build-compile.log | head -120 || true
            echo
            echo "== last 80 lines =="
            tail -80 build-compile.log || true
          } > out/diagnostics.txt
          wc -l out/diagnostics.txt

      # versionCode must go up for every build or Android refuses the update. The run number is
      # monotonic and unique, so it is the version code; the git SHA names the build.
      - name: Stamp version
        run: |
          sed -i "s/^        versionCode = .*/        versionCode = ${GITHUB_RUN_NUMBER}/" app/build.gradle.kts
          grep -n "versionCode" app/build.gradle.kts

      - name: Unit tests
        env:
          MANGASCRIBE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MANGASCRIBE_UPLOAD_KEYSTORE_BASE64 }}
          MANGASCRIBE_UPLOAD_STORE_PASSWORD: ${{ secrets.MANGASCRIBE_UPLOAD_STORE_PASSWORD }}
          MANGASCRIBE_UPLOAD_KEY_ALIAS: ${{ secrets.MANGASCRIBE_UPLOAD_KEY_ALIAS }}
          MANGASCRIBE_UPLOAD_KEY_PASSWORD: ${{ secrets.MANGASCRIBE_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build-test.log

      # Signed with the upload key when its secrets exist, so these APKs are the app's permanent
      # identity: every later build — including the one from Play — updates them in place.
      - name: Assemble APK
        env:
          MANGASCRIBE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MANGASCRIBE_UPLOAD_KEYSTORE_BASE64 }}
          MANGASCRIBE_UPLOAD_STORE_PASSWORD: ${{ secrets.MANGASCRIBE_UPLOAD_STORE_PASSWORD }}
          MANGASCRIBE_UPLOAD_KEY_ALIAS: ${{ secrets.MANGASCRIBE_UPLOAD_KEY_ALIAS }}
          MANGASCRIBE_UPLOAD_KEY_PASSWORD: ${{ secrets.MANGASCRIBE_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          # The signer of the artifact, in the log, so the identity is never a guess.
          APK=$(find app/build/outputs -name "*arm64-v8a*.apk" | head -1)
          if [ -n "$APK" ] && [ -x "${ANDROID_HOME}/build-tools/35.0.0/apksigner" ]; then
            "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -6 \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          find app/build/outputs -name "*.apk" -exec cp {} out/ \;
          ls -lh out || true
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          ls -lh out/*.apk >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no apk produced" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangascribe-debug-apk
          path: out/*.apk
          if-no-files-found: warn

      # The APK must be reachable by anyone with the repository link, signed in or not:
      # a GitHub release asset needs no token, and the run number keeps each build distinct.
      - name: Publish APK as a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh out/*.apk
          # One key signs every build — the upload key when its secrets are set, the project key
          # otherwise — so this installs straight over the previous one and keeps the library.
          APK=$(ls out/*arm64-v8a*.apk 2>/dev/null | head -1)
          if [ -n "$APK" ] && [ -x "${ANDROID_HOME}/build-tools/35.0.0/apksigner" ]; then
            "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$APK" \
              | head -4 >> "$GITHUB_STEP_SUMMARY" || true
          fi
          TAG="apk-${GITHUB_RUN_NUMBER}"
          # every split plus the universal one: the phone picks the smallest that fits
          gh release create "$TAG" out/*.apk \
            --title "MangaScribe APK (build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from \`${GITHUB_SHA:0:7}\` · versionCode ${GITHUB_RUN_NUMBER}.

          **Updates in place.** Every build is signed with the same key, and the version code
          goes up each time, so installing this APK over the previous one keeps your library,
          translations and saved keys — do not uninstall first, and do not install two different
          builds at once.

          Check the signer before installing, if you want: `apksigner verify --print-certs` on
          your copy, and compare the SHA-256 with the one printed in this run's log.

          Install: download the .apk, tap it, allow installing from this source, install.
          Requires Android 8.0 (API 26) or newer.

          Google Translate is the default engine, so no key is needed. Kurdish Sorani works out
          of the box; a model key in Settings improves tone in long dialogue." \
            --latest 2>&1 | tail -3
          gh release view "$TAG" --json url --jq .url

      # No log access from every environment, but the repository is readable from all of
      # them: a failed build commits what the compiler said to ci-diagnostics.txt.
      - name: Publish diagnostics to the branch
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "mangascribe-ci"
          git config user.email "ci@users.noreply.github.com"
          cp out/diagnostics.txt ci-diagnostics.txt
          git add ci-diagnostics.txt
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "ci: compiler diagnostics [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: out/diagnostics.txt
          if-no-files-found: ignore

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results*.html
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------
  # Play Store bundle. The .aab is signed with the owner's upload key, the same key that signs
  # the release APKs above, so Play and the GitHub releases are one app that can keep updating
  # itself for as long as the key exists. The key never enters the repository: it travels
  # through GitHub secrets (docs/play-store.md) and only exists as an environment variable
  # inside the build jobs.
  #
  # The job is skipped, not failed, when the secrets are absent, so the sideload APKs above keep
  # building for forks.
  # ---------------------------------------------------------------------------------------
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Gradle at the preinstalled SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Check for the upload key
        id: key
        env:
          KEY_B64: ${{ secrets.MANGASCRIBE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No MANGASCRIBE_UPLOAD_KEYSTORE_BASE64 secret: skipping the Play bundle (the APKs still build with the project key)." >> "$GITHUB_STEP_SUMMARY"
            echo "The upload key is the only thing that lets Play accept updates for this app;" >> "$GITHUB_STEP_SUMMARY"
            echo "add the four MANGASCRIBE_UPLOAD_* secrets described in docs/play-store.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version
        if: steps.key.outputs.present == 'true'
        run: |
          sed -i "s/^        versionCode = .*/        versionCode = ${GITHUB_RUN_NUMBER}/" app/build.gradle.kts
          grep -n "versionCode" app/build.gradle.kts

      - name: Build the app bundle
        if: steps.key.outputs.present == 'true'
        env:
          MANGASCRIBE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MANGASCRIBE_UPLOAD_KEYSTORE_BASE64 }}
          MANGASCRIBE_UPLOAD_STORE_PASSWORD: ${{ secrets.MANGASCRIBE_UPLOAD_STORE_PASSWORD }}
          MANGASCRIBE_UPLOAD_KEY_ALIAS: ${{ secrets.MANGASCRIBE_UPLOAD_KEY_ALIAS }}
          MANGASCRIBE_UPLOAD_KEY_PASSWORD: ${{ secrets.MANGASCRIBE_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      # Proves the artifact carries the user's key, not the project's: the certificate digest
      # printed here is what Play shows in App integrity → App signing key certificate.
      - name: Show the signing certificate
        if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p out
          cp app/build/outputs/bundle/release/*.aab out/mangascribe-${GITHUB_RUN_NUMBER}.aab
          ls -lh out/*.aab >> "$GITHUB_STEP_SUMMARY"
          KEYSTORE=$(mktemp)
          echo "$MANGASCRIBE_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" \
            -storepass "$MANGASCRIBE_UPLOAD_STORE_PASSWORD" \
            -alias "$MANGASCRIBE_UPLOAD_KEY_ALIAS" | grep -E "Alias|SHA256|Valid" >> "$GITHUB_STEP_SUMMARY" || true
          rm -f "$KEYSTORE"
        env:
          MANGASCRIBE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MANGASCRIBE_UPLOAD_KEYSTORE_BASE64 }}
          MANGASCRIBE_UPLOAD_STORE_PASSWORD: ${{ secrets.MANGASCRIBE_UPLOAD_STORE_PASSWORD }}
          MANGASCRIBE_UPLOAD_KEY_ALIAS: ${{ secrets.MANGASCRIBE_UPLOAD_KEY_ALIAS }}

      - name: Upload the bundle
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mangascribe-play-bundle
          path: out/*.aab
          if-no-files-found: error
